<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>ARDUINO DOOM - Low Spec Raycaster</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      color: #eee;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 10px;
    }
    #toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      background: #222;
      padding: 8px 14px;
      border: 1px solid #444;
    }
    button {
      background: #a00;
      color: #fff;
      border: none;
      padding: 6px 12px;
      font-family: monospace;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #c00; }
    button:disabled { background: #444; cursor: default; }
    #game {
      width: 640px;
      height: 400px;
      border: 2px solid #555;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      background: #000;
    }
    #controls-info {
      font-size: 12px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="btnConnect">Conectar Arduino (USB)</button>
    <span id="status">Estado: Desconectado (Usa teclado)</span>
    <span id="serialDebug">TX/RX: --</span>
  </div>

  <!-- Native 128x64 OLED resolution -->
  <canvas id="game" width="128" height="64"></canvas>

  <div id="controls-info">
    Teclado PC: W/S (Avanzar/Retroceder) | A/D o Flechas (Girar) | Espacio (Disparar) | M (Mapa) | R (Reiniciar)<br>
    Joystick KY-023: Mover/Girar (Ejes X/Y) | Disparar (Pulsar botón SW del joystick)
  </div>

  <script src="game.js?v=22"></script>
</body>
</html>
